name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth_session_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: auth_session_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auth_session_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      AUTH_SESSION_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=auth_session_test
      AUTH_SESSION_TEST_MYSQL_USER: root
      AUTH_SESSION_TEST_MYSQL_PASSWORD: root
      AUTH_SESSION_TEST_PG_DATABASE: auth_session_test
      AUTH_SESSION_TEST_PG_HOST: 127.0.0.1
      AUTH_SESSION_TEST_PG_PORT: '5432'
      AUTH_SESSION_TEST_PG_USER: postgres
      AUTH_SESSION_TEST_PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite,pdo_mysql,pdo_pgsql
          tools: composer:v2

      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist

      - if: matrix.php == '8.4'
        run: composer audit --no-interaction

      - run: composer phpstan
      - run: composer test
